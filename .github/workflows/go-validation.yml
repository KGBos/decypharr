name: Go validation

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfuse-dev fuse3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify generated JavaScript assets
        run: |
          npm run minify-js
          git diff --exit-code -- pkg/server/assets/build/js

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test all packages
        run: go test -timeout 10m ./...

      - name: Race-test provider admission and playback
        run: >-
          go test -race -timeout 10m
          ./internal/request
          ./pkg/debrid/account
          ./pkg/debrid/providers/torbox
          ./pkg/manager/link
          ./pkg/mount/dfs/backend/hanwen

      - name: Isolated FUSE lifecycle test
        run: |
          if [[ ! -c /dev/fuse ]]; then
            echo "::warning::Real FUSE lifecycle acceptance skipped: runner has no /dev/fuse."
            exit 0
          fi
          go test -c -o "$RUNNER_TEMP/hanwen.test" ./pkg/mount/dfs/backend/hanwen
          sudo env DECYPHARR_FUSE_TEST=1 unshare --mount --propagation private \
            "$RUNNER_TEMP/hanwen.test" -test.run '^TestFUSEDelayedCleanupPreservesReplacement$' -test.v
