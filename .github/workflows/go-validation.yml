name: Go validation

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Test critical packages
        run: >-
          go test
          ./pkg/debrid/providers/torbox
          ./internal/request
          ./pkg/manager
          ./pkg/manager/link
          ./pkg/mount/dfs/vfs
          ./pkg/repair
